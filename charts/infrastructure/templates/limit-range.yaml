apiVersion: v1
kind: LimitRange
metadata:
  name: app-resource-limit
spec:
  limits:
    - max:
        memory: 1Gi
        cpu: 500m
      min:
        memory: 256Mi
        cpu: 100m
      defaultRequest:
        memory: 512Mi
        cpu: 100m
      default:
        memory: 512Mi
        cpu: 500m
      type: Container
