apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: local-selfsigned-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: local-ca
spec:
  isCA: true
  commonName: "my-local-ca"
  secretName: local-ca-secret
  issuerRef:
    name: local-selfsigned-issuer
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: local-ca-issuer
spec:
  ca:
    secretName: local-ca-secret