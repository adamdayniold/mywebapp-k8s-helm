{{- if .Values.vpa.enabled -}}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: webapp-vpa
  namespace: {{ .Release.Namespace }}
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: Deployment
    name: webapp-deployment
  updatePolicy:
    updateMode: "{{ .Values.vpa.updateMode }}"
  resourcePolicy:
    containerPolicies:
      - containerName: webapp
        minAllowed:
          cpu: "{{ .Values.vpa.minAllowed.cpu }}"
          memory: "{{ .Values.vpa.minAllowed.memory }}"
        maxAllowed:
          cpu: "{{ .Values.vpa.maxAllowed.cpu }}"
          memory: "{{ .Values.vpa.maxAllowed.memory }}"
        controlledResources: {{ toJson .Values.vpa.controlledResources }}
{{- end -}}