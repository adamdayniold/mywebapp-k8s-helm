{{- if.Values.metrics.serviceMonitor.enabled  -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: webapp
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: webapp
  endpoints:
    - port: http
      path: {{ .Values.metrics.serviceMonitor.path }}
      interval: {{ .Values.metrics.serviceMonitor.interval }}
{{- end -}}