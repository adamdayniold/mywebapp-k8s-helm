mongo:
  replicaCount: 1
  image:
    repository: mongo
    tag: "8.0"
    pullPolicy: IfNotPresent
  livenessProbe:
    initialDelaySeconds: 15
    periodSeconds: 10
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
  service:
    port: 27017
    targetPort: 27017
  resources:
    requests:
      memory: 512Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m
  secret:
    name: mongo-secret
    usernameKey: mongo-user
    passwordKey: mongo-password
    dbnameKey: mongo-db-name
  persistence:
    storageClass: ""
    size: 5Gi
webapp:
  image:
    repository: adamdayniold/crud-mongodb
    tag: "sha-de8e16891022b4a60e6a5da519260539c365234c"
    pullPolicy: IfNotPresent
  livenessProbe:
    path: "/api/health"
    initialDelaySeconds: 15
    periodSeconds: 10
  readinessProbe:
    path: "/api/health/ready"
    initialDelaySeconds: 5
    periodSeconds: 10
  service:
    port: 3000
    targetPort: 3000
    developmentPort: 30100
    type: NodePort
  resources:
    requests:
      memory: 512Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m
hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  metric:
    name: cpu
    targetUtilizationPercentage: 50
vpa:
  enabled: true
  updateMode: "Auto"
  minAllowed:
    cpu: 50m
    memory: 64Mi
  maxAllowed:
    cpu: 1
    memory: 1Gi
  controlledResources: ["memory"]
metrics:
  serviceMonitor:
    enabled: true
    path: /api/metrics
    interval: 30s
gateway:
  enabled: true
  name: my-gateway
  namespace: application
httproute:
  enabled: true
  host: "webapp.local"

