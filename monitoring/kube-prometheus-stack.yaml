apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  targetNamespace: monitoring
  interval: 10m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "65.x.x"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  values:
    defaultRules:
      create: true
      appNamespaces: ["application", "cert-manager", "nginx-gateway"]
    prometheus:
      prometheusSpec:
        retention: "24h"
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        resources:
          requests:
            cpu: 200m
            memory: 400Mi
          limits:
            cpu: 500m
            memory: 1Gi
    grafana:
      enabled: true
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
        limits:
          cpu: 300m
          memory: 500Mi
      persistence:
        enabled: false
      additionalDataSources:
        - name: Loki
          type: loki
          uid: loki
          access: proxy
          url: http://monitoring-loki.monitoring.svc.cluster.local:3100
    alertmanager:
      enabled: true
      alertmanagerSpec:
        resources:
          requests:
            cpu: 50m
            memory: 100Mi
          limits:
            cpu: 100m
            memory: 200Mi
  install:
    createNamespace: true
  upgrade:
    remediation:
      retries: 3
  driftDetection:
    mode: enabled