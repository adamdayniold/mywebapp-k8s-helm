# redirect http to https
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: webapp-redirect-route
  namespace: application
spec:
  parentRefs:
  - name: my-gateway
    sectionName: http
  hostnames:
  - "webapp.local"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
---
# route to app
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: webapp-app-route
  namespace: application
spec:
  parentRefs:
  - name: my-gateway
    sectionName: https
  hostnames:
  - "webapp.local"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: webapp-service
      port: 3000