apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: my-gateway
  namespace: application
spec:
  gatewayClassName: nginx
  listeners:
  # for http protocol
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: All
  #  for https protocol
  - name: https
    protocol: HTTPS
    port: 443
    tls:
      mode: Terminate
      certificateRefs:
      - name: webapp-tls
    allowedRoutes:
      namespaces:
        from: All