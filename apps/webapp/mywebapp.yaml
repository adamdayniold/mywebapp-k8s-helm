---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mywebapp
  namespace: flux-system
spec:
  targetNamespace: application
  interval: 10m
  dependsOn:
    - name: infra
    - name: ngf
    - name: autoscalers
    - name: kube-prometheus-stack
  chart:
    spec:
      chart: ./charts/mywebapp
      reconcileStrategy: Revision
      valuesFiles:
        - ./charts/mywebapp/values.yaml
        - ./charts/mywebapp/values-k3d.yaml
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 1m
  install:
    createNamespace: true
  upgrade:
    remediation:
      retries: 3
  driftDetection:
    mode: enabled