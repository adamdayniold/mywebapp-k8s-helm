apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: infra
  namespace: flux-system
spec:
  targetNamespace: application
  interval: 10m
  dependsOn:
    - name: cert-manager
    - name: sealed-secrets
  chart:
    spec:
      chart: ./charts/infrastructure-namespace
      reconcileStrategy: Revision # pick up template changes without bumping Chart.yaml version
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 1m
  install:
    createNamespace: true
  upgrade:
    remediation:
      retries: 3
  driftDetection:
    mode: enabled