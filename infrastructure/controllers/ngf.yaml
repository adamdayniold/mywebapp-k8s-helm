apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ngf
  namespace: flux-system
spec:
  targetNamespace: nginx-gateway
  interval: 10m
  chart:
    spec:
      chart: nginx-gateway-fabric
      version: "2.8.0"
      sourceRef:
        kind: HelmRepository
        name: nginx-gateway-fabric
        namespace: flux-system
  install:
    createNamespace: true
  upgrade:
    remediation:
      retries: 3
  driftDetection:
    mode: enabled