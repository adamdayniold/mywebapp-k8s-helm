apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: autoscalers
  namespace: flux-system
spec:
  targetNamespace: kube-system
  interval: 10m
  chart:
    spec:
      chart: vertical-pod-autoscaler
      version: "11.1.1"
      sourceRef:
        kind: HelmRepository
        name: cowboysysop-charts
        namespace: flux-system
  install:
    createNamespace: true
  upgrade:
    remediation:
      retries: 3
  driftDetection:
    mode: enabled