apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: autoscalers
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ghcr.io/cowboysysop/charts
    chart: vertical-pod-autoscaler
    targetRevision: 11.1.1
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true