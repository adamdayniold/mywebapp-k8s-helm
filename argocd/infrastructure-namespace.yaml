apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-namespace
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:adamdayniold/mywebapp-k8s-helm.git
    targetRevision: HEAD
    path: charts/infrastructure-namespace  # Points directly to your app chart
    # If your chart uses custom values:
    # helm:
    #   valueFiles:
    #     - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: application # Your target app namespace
  syncPolicy:
    automated:
      prune: true     # Deletes resources in k8s if deleted from Git
      selfHeal: true  # Reverts manual changes made directly in the cluster
    syncOptions:
      - CreateNamespace=true # Automatically creates the target namespace if it doesn't exist