apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-alloy
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    - repoURL: 'https://grafana.github.io/helm-charts'
      chart: alloy
      targetRevision: 0.7.x # Or the latest stable chart version
      helm:
        valueFiles:
          - $values/charts/monitoring/values/alloy-values.yaml
    - repoURL: 'git@github.com:adamdayniold/mywebapp-k8s-helm.git'
      targetRevision: HEAD
      ref: values
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true