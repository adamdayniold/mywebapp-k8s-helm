defaultRules:
  create: true
  appNamespaces: ["default", "application", "argocd"]

prometheus:
  prometheusSpec:
    retention: "24h" # Keep metrics lightweight for local testing
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 200m
        memory: 400Mi
      limits:
        cpu: 500m
        memory: 1Gi

grafana:
  enabled: true
  adminPassword: "admin" # (For local convenience; production would use Sealed Secrets)
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
    limits:
      cpu: 300m
      memory: 500Mi
  persistence:
    enabled: false # Use ephemeral storage for local testing; change to true with PVC in prod

alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 100Mi
      limits:
        cpu: 100m
        memory: 200Mi