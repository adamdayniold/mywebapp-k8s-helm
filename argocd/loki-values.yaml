deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schema_config:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v11
        index:
          prefix: loki_index_
          period: 24h

singleBinary:
  replicas: 1
  persistence:
    enabled: false # Uses ephemeral storage for local testing
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
    limits:
      cpu: 300m
      memory: 500Mi

# Disable heavy distributed components not needed for local setup
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
pulsar:
  enabled: false
minio:
  enabled: false