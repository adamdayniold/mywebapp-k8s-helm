apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: nginx-gateway-fabric
  namespace: flux-system
spec:
  interval: 1h
  type: oci
  url: oci://ghcr.io/nginx/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ngf
  namespace: nginx-gateway
spec:
  interval: 10m
  chart:
    spec:
      chart: nginx-gateway-fabric
      version: "2.8.0"
      sourceRef:
        kind: HelmRepository
        name: nginx-gateway-fabric
        namespace: flux-system
  install:
    createNamespace: true
    # Flux uses Server-Side Apply by default via its patch/apply methods
  upgrade:
    remediation:
      retries: 3
  # This mimics Argo CD's automated selfHeal and prune
  driftDetection:
    mode: enabled