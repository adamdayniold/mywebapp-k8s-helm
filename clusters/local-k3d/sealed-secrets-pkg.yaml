apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: sealed-secrets
  namespace: flux-system
spec:
  interval: 1h
  type: default
  url: https://bitnami.github.io/sealed-secrets
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sealed-secrets
  namespace: flux-system
spec:
  targetNamespace: kube-system
  interval: 10m
  chart:
    spec:
      chart: sealed-secrets
      version: "v2.20.0"
      sourceRef:
        kind: HelmRepository
        name: sealed-secrets
        namespace: flux-system
  install:
    createNamespace: true
    # Flux uses Server-Side Apply by default via its patch/apply methods
  upgrade:
    remediation:
      retries: 3
  # This mimics Argo CD's automated selfHeal and prune
  driftDetection:
    mode: enabled