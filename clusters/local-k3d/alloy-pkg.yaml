apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-alloy
  namespace: flux-system
spec:
  targetNamespace: monitoring
  interval: 10m
  chart:
    spec:
      chart: alloy
      version: "0.16.0"
      sourceRef:
        kind: HelmRepository
        name: grafana-charts
        namespace: flux-system
  values:
    controller:
      type: daemonset
    alloy:
      configMap:
        content: |
          // 2. Replaced API discovery with node filesystem file matching for DaemonSets
          local.file_match "pod_logs" {
            path_targets = [{
              __path__ = "/var/log/pods/*/*/*.log",
            }]
          }

          loki.source.file "pod_logs" {
            targets       = local.file_match.pod_logs.targets
            forward_to    = [loki.write.endpoint.receiver]
            tail_from_end = true
          }

          loki.write "endpoint" {
            endpoint {
              url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
            }
          }
    resources:
      requests:
        cpu: 50m
        memory: 100Mi
      limits:
        cpu: 200m
        memory: 300Mi
  install:
    createNamespace: true
  upgrade:
    remediation:
      retries: 3
  driftDetection:
    mode: enabled