apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure
  prune: true
  wait: true        # Ready only when its HelmReleases are Ready (so CRDs exist)
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
